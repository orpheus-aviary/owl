appId: com.orpheusaviary.owl
productName: Owl
directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - '!**/*.{ts,map,md,flow}'
  - '!**/node_modules/*/{test,tests,__tests__,example,examples,doc,docs}/**'
# Workspace deps (@owl/core, @owl/daemon) + their transitive deps
# are picked up via packages/gui/package.json dependencies (path A in §2.4).

asar: false

# After the .app is assembled, run a manual ad-hoc codesign over the bundle.
# See scripts/codesign-adhoc.mjs for why this is needed.
afterPack: scripts/codesign-adhoc.mjs

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

dmg:
  artifactName: Owl-${version}-${arch}.${ext}
  writeUpdateInfo: false
